services:
  phase0-vld:
    build:
      context: .
      target: vld
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.2.10-cli}
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      OPCODE_DUMPER: vld
    command: ["bash", "/workspace/run.sh", "--inside"]

  phase0-opcache:
    build:
      context: .
      target: opcache
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.2.10-cli}
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      OPCODE_DUMPER: opcache
    command: ["bash", "/workspace/run.sh", "--inside"]
