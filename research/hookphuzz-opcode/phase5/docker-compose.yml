services:
  enabled:
    build:
      context: .
      target: enabled
    command: ["bash", "-c", "chown -R www-data:www-data /shared /logs && exec apache2-foreground"]
    volumes:
      - ./fixtures:/var/www/html:ro
      - phase5-artifacts:/shared
      - phase5-enabled-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health.php >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  disabled:
    build:
      context: .
      target: disabled
    command: ["bash", "-c", "chown -R www-data:www-data /shared /logs && exec apache2-foreground"]
    volumes:
      - ./fixtures:/var/www/html:ro
      - phase5-disabled-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health.php >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  verifier:
    build:
      context: .
      target: verifier
    depends_on:
      enabled:
        condition: service_healthy
      disabled:
        condition: service_healthy
    volumes:
      - .:/workspace
      - phase5-artifacts:/shared:ro
      - phase5-enabled-logs:/logs/enabled:ro
      - phase5-disabled-logs:/logs/disabled:ro
    entrypoint: ["bash", "/workspace/verifier/run.sh"]

volumes:
  phase5-artifacts:
  phase5-enabled-logs:
  phase5-disabled-logs:
