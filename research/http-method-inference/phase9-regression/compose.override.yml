services:
  db-enabled:
    pull_policy: never
  db-disabled:
    pull_policy: never
  enabled:
    image: hookphuzz-opcode-phase9-enabled:latest
    pull_policy: never
  disabled:
    image: hookphuzz-opcode-phase9-disabled:latest
    pull_policy: never
  enabled-static:
    image: hookphuzz-opcode-phase9-enabled-static:latest
    pull_policy: never
  verifier:
    image: hookphuzz-opcode-phase9-verifier:latest
    pull_policy: never
    volumes:
      - type: bind
        source: ${HOOKPHUZZ_PHASE9_SOURCE}
        target: /workspace
        read_only: true
      - type: bind
        source: ${HOOKPHUZZ_PHASE9_RESULTS}
        target: /workspace/results

networks:
  default:
    internal: true
