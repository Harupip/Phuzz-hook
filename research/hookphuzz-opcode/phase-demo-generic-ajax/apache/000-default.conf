<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /logs/apache-error.log
    CustomLog /logs/access.log combined
    LogLevel warn

    php_admin_flag log_errors on
    php_admin_value error_log /logs/php-error.log

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

