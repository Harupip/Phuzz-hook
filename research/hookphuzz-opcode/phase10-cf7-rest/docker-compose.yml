services:
  db:
    image: mariadb:10.11.8
    environment: { MARIADB_DATABASE: wordpress, MARIADB_USER: wordpress, MARIADB_PASSWORD: wordpress, MARIADB_ROOT_PASSWORD: root-password }
    healthcheck: { test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot-password --silent"], interval: 1s, timeout: 3s, retries: 90 }
  web:
    image: hookphuzz-phase10-cf7-rest-web:local
    build: { context: ., dockerfile: Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment: { WORDPRESS_DB_HOST: db, WORDPRESS_DB_NAME: wordpress, WORDPRESS_DB_USER: wordpress, WORDPRESS_DB_PASSWORD: wordpress, WORDPRESS_URL: http://localhost }
    volumes:
      - phase10-cf7-rest-wp:/var/www/html
      - ./results:/results
      - phase10-cf7-rest-opcode:/shared
      - .:/workspace:ro
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"], interval: 1s, timeout: 3s, retries: 90 }
volumes: { phase10-cf7-rest-wp: , phase10-cf7-rest-opcode: }
