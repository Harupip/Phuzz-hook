services:
  db:
    image: mariadb:10.11.8
    environment: { MARIADB_DATABASE: wordpress, MARIADB_USER: wordpress, MARIADB_PASSWORD: wordpress, MARIADB_ROOT_PASSWORD: root-password }
    healthcheck: { test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot-password --silent"], interval: 1s, timeout: 3s, retries: 90 }
    networks: [phase13]
  web:
    image: hookphuzz-phase13:local
    depends_on: { db: { condition: service_healthy } }
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      PHASE13_PLUGIN_ZIP: ${PHASE13_PLUGIN_ZIP}
      PHASE13_PLUGIN_SLUG: ${PHASE13_PLUGIN_SLUG}
      PHASE13_PLUGIN_VERSION: ${PHASE13_PLUGIN_VERSION}
      PHASE13_LOCAL_PASSWORD: ${PHASE13_LOCAL_PASSWORD}
      PHASE13_PLUGIN_SHA256: ${PHASE13_PLUGIN_SHA256}
      PHASE13_RESULTS_DIR: ${PHASE13_RESULTS_DIR}
      PHASE13_RUN_ID: ${PHASE13_RUN_ID}
      TARGET_APP_PATH: /var/www/html/wp-content/plugins/${PHASE13_PLUGIN_SLUG}/
      FUZZER_HOOK_OUTPUT_DIR: /shared-tmpfs/hook-coverage
    volumes:
      - phase13-wp:/var/www/html
      - ../../../phuzz-main/code/web/applications/wordpress/_plugins:/plugin-zips:ro
      - ./scripts:/phase13/scripts:ro
      - ./results:/results
      - ../../../phuzz-main/code/fuzzer:/hookphuzz-fuzzer:ro
    tmpfs: [/shared-tmpfs]
    networks: [phase13]
    healthcheck: { test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"], interval: 1s, timeout: 3s, retries: 90 }
volumes: { phase13-wp: }
networks: { phase13: { internal: true } }
