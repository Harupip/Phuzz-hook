services:
  wordpress:
    image: hookphuzz-opcode-demo-generic-ajax-wordpress:latest

  phuzz-loader:
    image: code-fuzzer-wordpress-plugin:latest
    depends_on:
      wordpress:
        condition: service_healthy
    entrypoint: ["python", "/workspace/weekly_loader.py"]
    working_dir: /work
    environment:
      HOOKPHUZZ_WEEKLY_RUN_ID: ${HOOKPHUZZ_WEEKLY_RUN_ID:?weekly run id required}
      HOOKPHUZZ_WEEKLY_PROJECT: ${HOOKPHUZZ_WEEKLY_PROJECT:?weekly project required}
      HOOKPHUZZ_WEEKLY_REGRESSION_PASS: ${HOOKPHUZZ_WEEKLY_REGRESSION_PASS:?regression status required}
    volumes:
      - ../phase-demo-generic-ajax/verifier:/workspace:ro
      - ${HOOKPHUZZ_FUZZER_DIR:?fuzzer directory required}:/app:ro
      - ${HOOKPHUZZ_REPO_ROOT:?repository root required}:/repository:ro
      - ${HOOKPHUZZ_WEEKLY_RESULTS_DIR:?weekly results directory required}:/results
      - demo-artifacts:/shared:ro
