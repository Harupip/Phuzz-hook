services:
  db-enabled:
    image: mariadb:10.11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root-password
    volumes:
      - phase7-db-enabled:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot-password --silent"]
      interval: 1s
      timeout: 3s
      retries: 60

  db-disabled:
    image: mariadb:10.11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root-password
    volumes:
      - phase7-db-disabled:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot-password --silent"]
      interval: 1s
      timeout: 3s
      retries: 60

  enabled:
    build:
      context: .
      target: enabled
      args:
        WORDPRESS_VERSION: 6.5.5
    depends_on:
      db-enabled:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-enabled
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: phase7_enabled_
      WORDPRESS_URL: http://enabled
    command: ["/usr/local/bin/wordpress-entrypoint"]
    volumes:
      - phase7-wp-enabled:/var/www/html
      - ./fixture/hookphuzz-phase7-fixture:/opt/phase7-plugin:ro
      - phase7-enabled-artifacts:/shared
      - phase7-enabled-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 90
      start_period: 5s

  disabled:
    build:
      context: .
      target: disabled
      args:
        WORDPRESS_VERSION: 6.5.5
    depends_on:
      db-disabled:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-disabled
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: phase7_disabled_
      WORDPRESS_URL: http://disabled
    command: ["/usr/local/bin/wordpress-entrypoint"]
    volumes:
      - phase7-wp-disabled:/var/www/html
      - ./fixture/hookphuzz-phase7-fixture:/opt/phase7-plugin:ro
      - phase7-disabled-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 90
      start_period: 5s

  verifier:
    build:
      context: .
      target: verifier
      args:
        WORDPRESS_VERSION: 6.5.5
    depends_on:
      enabled:
        condition: service_healthy
      disabled:
        condition: service_healthy
    volumes:
      - .:/workspace
      - phase7-enabled-artifacts:/shared:ro
      - phase7-enabled-logs:/logs/enabled:ro
      - phase7-disabled-logs:/logs/disabled:ro
    entrypoint: ["bash", "/workspace/tests/run.sh"]

volumes:
  phase7-db-enabled:
  phase7-db-disabled:
  phase7-wp-enabled:
  phase7-wp-disabled:
  phase7-enabled-artifacts:
  phase7-enabled-logs:
  phase7-disabled-logs:
